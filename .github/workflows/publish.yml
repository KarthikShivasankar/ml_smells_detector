name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token required.
#
# One-time setup on PyPI (https://pypi.org/manage/project/ml-code-smell-detector/settings/publishing/):
#   - Add a "Trusted Publisher" with:
#       Owner:           KarthikShivasankar
#       Repository:      ml_smells_detector
#       Workflow name:   publish.yml
#       Environment:     pypi
#
# To release: bump `version` in pyproject.toml, then publish a GitHub Release
# (or push a tag like v0.1.2 and create the release).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ml-code-smell-detector/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
