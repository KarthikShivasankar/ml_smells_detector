name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml runs this whole workflow as its release gate, and publishes the dist artifact it builds
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Flake8
        run: uv run python -m flake8 ml_code_smell_detector tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev

      - name: Run tests (coverage floor in pyproject.toml)
        run: uv run python -m pytest tests/ -v -rs --cov=ml_code_smell_detector --cov-report=term-missing

  min-deps:
    name: Test oldest supported dependencies (Python 3.10, astroid 3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.10"

      - name: Install the declared minimums
        run: |
          uv venv
          uv pip install -e . "astroid==3.0.0" "tqdm==4.60.0" pytest

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q -rs

  docs:
    name: Docs build (as on Read the Docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Install docs requirements and the package
        run: |
          uv venv
          uv pip install -r docs/requirements.txt .

      - name: Build HTML, warnings are errors
        run: .venv/bin/sphinx-build -W --keep-going -b html docs/source docs/build/html

  build:
    name: Build, check and smoke-test the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*

      # Install the wheel into a fresh venv and run it from outside the source tree, so the packaged files
      # (not the checkout) are what gets imported: catches modules or entry points missing from the wheel.
      - name: Smoke-test the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/ml_smell_detector" --version
          "$RUNNER_TEMP/smoke/bin/python" -m ml_code_smell_detector analyze "$GITHUB_WORKSPACE/tests/corpus" --format json > report.json
          "$RUNNER_TEMP/smoke/bin/python" -m ml_code_smell_detector analyze "$GITHUB_WORKSPACE/tests/corpus" --format sarif > report.sarif
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import json
          import ml_code_smell_detector
          assert "site-packages" in ml_code_smell_detector.__file__, ml_code_smell_detector.__file__
          summary = json.load(open("report.json"))["summary"]
          assert summary["errors"] == 0 and summary["findings"] > 0, summary
          assert json.load(open("report.sarif"))["runs"][0]["results"]
          print("wheel OK:", ml_code_smell_detector.__version__, summary["findings"], "findings")
          EOF

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
