version: 2
updates:
  # Workflow actions (checkout, setup-uv, artifacts, PyPI publish)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # uv.lock: runtime and dev dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # docs/requirements.txt (Read the Docs)
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
