version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"

python:
  install:
    - requirements: docs/requirements.txt
    # Install the package so autodoc can import it (and astroid/tqdm); conf.py only adds the source path
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py
