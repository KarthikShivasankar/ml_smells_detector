[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-code-smell-detector"
version = "0.1.1"
description = "A package to detect code smells in machine learning code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Karthik Shivashankar", email = "karthik13sankar@outlook.com" }
]
keywords = ["machine-learning", "code-quality", "static-analysis", "code-smells"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "astroid>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/KarthikShivasankar/ml_code_smell_detector"
Repository = "https://github.com/KarthikShivasankar/ml_code_smell_detector"

[project.scripts]
ml_smell_detector = "ml_code_smell_detector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ml_code_smell_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 150
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info", "docs"]
