[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-code-smell-detector"
version = "0.1.2"
description = "A package to detect code smells in machine learning code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Karthik Shivashankar", email = "karthik13sankar@outlook.com" }
]
keywords = ["machine-learning", "code-quality", "static-analysis", "code-smells"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "astroid>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "flake8>=6.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/KarthikShivasankar/ml_smells_detector"
Repository = "https://github.com/KarthikShivasankar/ml_smells_detector"
"Bug Tracker" = "https://github.com/KarthikShivasankar/ml_smells_detector/issues"

[project.scripts]
ml_smell_detector = "ml_code_smell_detector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ml_code_smell_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"
exclude = ["docs", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
