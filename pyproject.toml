[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-code-smell-detector"
version = "0.1.2"
description = "A package to detect code smells in machine learning code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Karthik Shivashankar", email = "karthik13sankar@outlook.com" }
]
keywords = ["machine-learning", "code-quality", "static-analysis", "code-smells"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "astroid>=3.0",  # nodes.Try (3.0 replaced TryExcept/TryFinally); 3.0.0 is tested, 2.x fails
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Floors are the oldest versions that still install on Python 3.10; uv.lock pins the newest per Python version
# (e.g. Sphinx 9.x needs Python 3.12+, so 3.10 resolves to Sphinx 8.x).
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "flake8>=7.4",
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.1",
    "sphinx-autodoc-typehints>=3.0",
    "myst-parser>=4.0",
]

[project.urls]
Homepage = "https://github.com/KarthikShivasankar/ml_smells_detector"
Repository = "https://github.com/KarthikShivasankar/ml_smells_detector"
"Bug Tracker" = "https://github.com/KarthikShivasankar/ml_smells_detector/issues"

[project.scripts]
ml_smell_detector = "ml_code_smell_detector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ml_code_smell_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"
exclude = ["docs", "build", "dist", ".venv", "tests/corpus"]  # corpus: deliberately smelly code

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
